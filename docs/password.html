<body>
    <!-- Start Preloader Area -->
    <div class="preloader-area text-center position-fixed top-0 bottom-0 start-0 end-0" id="preloader">
        <div class="loader position-absolute start-0 end-0">
            <img src="assets/images/favicon.png" alt="favicon" class="img-fluid" style="width: 70px; height: 70px;">
            <div class="wavy position-relative fw-light">
                <span class="d-inline-block"></span>
                <span class="d-inline-block">K</span>
                <span class="d-inline-block">R</span>
                <span class="d-inline-block">E</span>
                <span class="d-inline-block">D</span>
                <span class="d-inline-block">I</span>
                <span class="d-inline-block">M</span>
                <span class="d-inline-block">G</span>
                <span class="d-inline-block">E</span>
                <span class="d-inline-block">L</span>
                <span class="d-inline-block">D</span>
                <span class="d-inline-block">I</span>
            </div>
        </div>
    </div>
    <!-- End Preloader Area -->
    <div id="header-placeholder"></div>
    <!-- End Navbar Area -->
    <div class="mobile-navbar offcanvas offcanvas-end border-0" data-bs-backdrop="static" tabindex="-1"
        id="navbarOffcanvas">

    </div>

    <!-- Start Forgot Password Page -->
    <div class="forgot-password-page overflow-hidden">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-6 col-md-12">
                    <form class="login-form bg-color-fffaeb radius-30 border-bx" id="reset-request-form" novalidate>
                        <div class="text-center mb-5">
                            <a href="index.html" class="d-block">
                                <img src="assets/images/favicon.png" alt="image">
                            </a>
                        </div>
                        <h2 class="text-center">Şifreni mi unuttun?</h2>
                        <label class="form-label">E-Posta Adresi</label>
                        <input type="email" name="email" class="form-control" placeholder="E-Posta" autocomplete="email" required>

                        <button type="submit" class="default-btn w-100 text-center">Şifreni Sıfırla</button>
                    </form>

                    <form class="login-form bg-color-fffaeb radius-30 border-bx d-none" id="new-password-form" novalidate>
                        <div class="text-center mb-5">
                            <a href="index.html" class="d-block">
                                <img src="assets/images/favicon.png" alt="image">
                            </a>
                        </div>
                        <h2 class="text-center">Yeni Şifre Belirle</h2>
                        <input type="password" name="password" class="form-control" placeholder="Yeni Şifre (en az 8 karakter)" autocomplete="new-password" minlength="8" required>
                        <input type="password" name="password2" class="form-control" placeholder="Yeni Şifre Tekrar" autocomplete="new-password" required>

                        <button type="submit" class="default-btn w-100 text-center">Şifremi Güncelle</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <!-- End Forgot Password Page -->

    <div id="footer-placeholder" class="footer-area bg-color-0c3a30 pt-120">
    </div>

    <!-- Go top Btn -->
    <div class="go-top">
        <i class="ri-arrow-up-fill"></i>
    </div>
    <!-- Go top Btn End -->

    <!-- JS Files -->
    <script src="assets/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/swiper-bundle.min.js"></script>
    <script src="assets/js/fslightbox.min.js"></script>
    <script src="assets/js/smooth-scroll.js"></script>
    <script src="assets/js/scrollCue.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
    <script src="assets/js/auth-config.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/script.js?v=2"></script>
    <script src="assets/js/formlar.js?v=1"></script>
    <script>
        (function () {
            const requestForm = document.getElementById('reset-request-form');
            const newForm = document.getElementById('new-password-form');

            function showNewPasswordForm() {
                requestForm.classList.add('d-none');
                newForm.classList.remove('d-none');
            }

            if (KGAuth.urlError()) {
                KGAuth.showMessage(requestForm, KGAuth.urlError());
            } else if (KGAuth.isRecovery()) {
                showNewPasswordForm();
            }
            if (KGAuth.client) {
                KGAuth.client.auth.onAuthStateChange(event => {
                    if (event === 'PASSWORD_RECOVERY') showNewPasswordForm();
                });
            }

            requestForm.addEventListener('submit', async function (e) {
                e.preventDefault();
                const email = requestForm.email.value.trim();
                if (!email) return KGAuth.showMessage(requestForm, 'E-posta adresinizi girin.');
                KGAuth.setBusy(requestForm, true);
                const { error } = await KGAuth.sendPasswordReset(email);
                KGAuth.setBusy(requestForm, false);
                if (error) return KGAuth.showMessage(requestForm, KGAuth.translateError(error));
                requestForm.reset();
                KGAuth.showMessage(requestForm, 'Bu adrese kayıtlı bir hesap varsa şifre sıfırlama bağlantısı gönderdik. Gelen kutunuzu kontrol edin.', 'success');
            });

            newForm.addEventListener('submit', async function (e) {
                e.preventDefault();
                const password = newForm.password.value;
                if (password.length < 8) return KGAuth.showMessage(newForm, 'Şifre en az 8 karakter olmalı.');
                if (password !== newForm.password2.value) return KGAuth.showMessage(newForm, 'Şifreler eşleşmiyor.');
                KGAuth.setBusy(newForm, true);
                const { error } = await KGAuth.updatePassword(password);
                KGAuth.setBusy(newForm, false);
                if (error) return KGAuth.showMessage(newForm, KGAuth.translateError(error));
                newForm.reset();
                KGAuth.showMessage(newForm, 'Şifreniz güncellendi. Hesabınıza yönlendiriliyorsunuz...', 'success');
                setTimeout(() => window.location.replace('hesabim.html'), 1500);
            });
        })();
    </script>
    <script>
        fetch('components/mobile_navbar.html?v=2')
            .then(response => response.text())
            .then(data => {
                document.getElementById('navbarOffcanvas').innerHTML = data;
            });





        fetch('components/footer.html?v=3')
            .then(response => response.text())
            .then(data => {
                // document.getElementById('footer-area') add as a scildren
                document.getElementById('footer-placeholder').innerHTML = data;
            });
    </script>
</body>

</html>
