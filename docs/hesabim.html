    <!-- Essential CSS Files -->

    <link rel="stylesheet" href="assets/css/flaticon_finto.css">
    <link rel="stylesheet" href="assets/css/scrollCue.css">
    <link rel="stylesheet" href="assets/css/remixicon.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/responsive.css">

    <!-- Title & Favicon -->
    <title>Hesabım - KredimGeldi</title>
    <!-- some good looking meta tags for SEO and preview -->

    <link rel="icon" type="image/png" href="assets/images/favicon.png">

<body>
    <!-- Start Preloader Area -->
    <div class="preloader-area text-center position-fixed top-0 bottom-0 start-0 end-0" id="preloader">
        <div class="loader position-absolute start-0 end-0">
            <img src="assets/images/favicon.png" alt="favicon" class="img-fluid" style="width: 70px; height: 70px;">
            <div class="wavy position-relative fw-light">
                <span class="d-inline-block"></span>
                <span class="d-inline-block">K</span>
                <span class="d-inline-block">R</span>
                <span class="d-inline-block">E</span>
                <span class="d-inline-block">D</span>
                <span class="d-inline-block">I</span>
                <span class="d-inline-block">M</span>
                <span class="d-inline-block">G</span>
                <span class="d-inline-block">E</span>
                <span class="d-inline-block">L</span>
                <span class="d-inline-block">D</span>
                <span class="d-inline-block">I</span>
            </div>
        </div>
    </div>
    <!-- End Preloader Area -->

    <div id="header-placeholder"></div>
    <!-- End Navbar Area -->
    <div class="mobile-navbar offcanvas offcanvas-end border-0" data-bs-backdrop="static" tabindex="-1"
        id="navbarOffcanvas">

    </div>


    <!-- Search Modal -->
    <div class="search-modal modal fade" id="exampleModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header position-relative">
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"> </button>
                </div>
                <div class="modal-body">
                    <form class="popup-form">
                        <input type="text" class="form-control" placeholder="Search here">
                        <button type="submit" class="popup-btn">
                            <i class="ri-search-line"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <!-- End Search Modal -->



    <div class="my-account-page ptb-120 overflow-hidden">
        <div class="container">
            <div class="row g-4 d-none" id="account-content">
                <div class="col-lg-6 col-md-12">
                    <div class="login-form bg-color-fffaeb radius-30">
                        <h3>Hesabım</h3>
                        <p class="mb-2"><strong>İsim:</strong> <span id="account-name"></span></p>
                        <p class="mb-2"><strong>E-Posta:</strong> <span id="account-email"></span></p>
                        <p class="mb-4"><strong>Üyelik Tarihi:</strong> <span id="account-created"></span></p>
                        <button type="button" class="default-btn w-100 text-center" data-kg-signout>Çıkış Yap</button>
                    </div>
                </div>
                <div class="col-lg-6 col-md-12">
                    <form class="login-form bg-color-fffaeb radius-30" id="change-password-form" novalidate>
                        <h3>Şifre Değiştir</h3>
                        <input type="password" name="password" class="form-control" placeholder="Yeni Şifre (en az 8 karakter)" autocomplete="new-password" minlength="8" required>
                        <input type="password" name="password2" class="form-control" placeholder="Yeni Şifre Tekrar" autocomplete="new-password" required>
                        <button type="submit" class="default-btn w-100 text-center">Şifremi Güncelle</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <div id="footer-placeholder" class="footer-area bg-color-0c3a30 pt-120">
    </div>
    <div class="go-top">
        <i class="ri-arrow-up-fill"></i>
    </div>
    <script>
        fetch('components/mobile_navbar.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('navbarOffcanvas').innerHTML = data;
            });





        fetch('components/footer.html')
            .then(response => response.text())
            .then(data => {
                // document.getElementById('footer-area') add as a scildren
                document.getElementById('footer-placeholder').innerHTML = data;
            });
    </script>
    <style>
        .main-navbar {
            box-shadow: 0px 0px 20px 0px rgba(0, 0, 0, 0.1);
            position: absolute;
            width: 100%;
        }

        .my-account-page{
            padding-top:180px;
        }



    </style>

    <script src="assets/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/swiper-bundle.min.js"></script>
    <script src="assets/js/fslightbox.min.js"></script>
    <script src="assets/js/smooth-scroll.js"></script>
    <script src="assets/js/scrollCue.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
    <script src="assets/js/auth-config.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/script.js"></script>
    <script>
        (async function () {
            const user = await KGAuth.requireUser();
            if (!user) return;

            document.getElementById('account-name').textContent = KGAuth.displayName(user);
            document.getElementById('account-email').textContent = user.email;
            document.getElementById('account-created').textContent = new Date(user.created_at).toLocaleDateString('tr-TR');
            document.getElementById('account-content').classList.remove('d-none');

            const form = document.getElementById('change-password-form');
            form.addEventListener('submit', async function (e) {
                e.preventDefault();
                const password = form.password.value;
                if (password.length < 8) return KGAuth.showMessage(form, 'Şifre en az 8 karakter olmalı.');
                if (password !== form.password2.value) return KGAuth.showMessage(form, 'Şifreler eşleşmiyor.');
                KGAuth.setBusy(form, true);
                const { error } = await KGAuth.updatePassword(password);
                KGAuth.setBusy(form, false);
                if (error) return KGAuth.showMessage(form, KGAuth.translateError(error));
                form.reset();
                KGAuth.showMessage(form, 'Şifreniz güncellendi.', 'success');
            });
        })();
    </script>
</body>

</html>
