    </div>
    <!-- Go top Btn End -->

    <!-- JS Files -->

    <script>
        fetch('components/mobile_navbar.html?v=3')
            .then(response => response.text())
            .then(data => {
                document.getElementById('navbarOffcanvas').innerHTML = data;
            });





        fetch('components/footer.html?v=5')
            .then(response => response.text())
            .then(data => {
                // document.getElementById('footer-area') add as a scildren
                document.getElementById('footer-placeholder').innerHTML = data;
            });


        // get the query param type 
        // type=kredi-karnesi
        const urlParams = new URLSearchParams(window.location.search);
        const type = urlParams.get('type');


        const serviceDetails = {
            "kredi-karnesi": {
                title: "Kredi Karnesi",
                href: "service-details.html?type=kredi-karnesi"
            },
            "kredi-karti": {
                title: "Kredi Kartı",
                href: "service-details.html?type=kredi-karti"
            },
            "mevduat": {
                title: "Mevduat",
                href: "service-details.html?type=mevduat"
            },
            "yatirim": {
                title: "Yatırım",
                href: "service-details.html?type=yatirim"
            },
            "sigorta": {
                title: "Sigorta",
                href: "service-details.html?type=sigorta"
            }
        }

        // <li>
        //     <a href="service-details.html">Kampanyalar</a>
        // </li>

        // get popular-services and ul under that
        const popularServices = document.querySelector('.popular-services ul');
        for (const key in serviceDetails) {
            if (key === type) continue;
            const li = document.createElement('li');
            const a = document.createElement('a');
            a.href = serviceDetails[key].href;
            a.textContent = serviceDetails[key].title;
            li.appendChild(a);
            popularServices.appendChild(li);
        }


        // Tür yoksa veya tanınmıyorsa hizmetler listesine dön.
        if (!serviceDetails[type]) {
            window.location.replace("services.html");
        }
        const pagename = serviceDetails[type] ? serviceDetails[type].title : "";
        if (pagename) {
            document.title = pagename + " - KredimGeldi";
            const canonical = document.querySelector('link[rel="canonical"]');
            if (canonical) canonical.href = "https://kredimgeldi.com/service-details.html?type=" + type;
        }

        if (pagename) document.addEventListener("DOMContentLoaded", function () {
            fetch("service-details.json")
                .then(response => response.json())
                .then(jsonData => {

                    updatePageContent(jsonData, pagename);
                })
                .catch(error => console.error("Error loading JSON:", error));
        });

        function updatePageContent(jsonData, pageName) {
            const page = jsonData.pages.find(p => p.name === pageName);
            if (!page) return;

            const content = page.content[0];

            document.getElementById("heading-title").textContent = content.header || "";
            document.getElementById("content-1").textContent = content["Main-1"] || "";
            document.getElementById("content-2").textContent = content["Main-2"] || "";
            document.getElementById("content-3").textContent = content["Main-3"] || "";
            document.getElementById("content-4").textContent = content["Main-4"] || "";

            document.getElementById("bullet-title").textContent = content.Bullet?.Header || "";
            // add <i class="ri-check-line"></i> to li
            document.getElementById("bullet-1").innerHTML = `<i class="ri-check-line"></i>${content.Bullet?.["Bullet-1"] || ""}`;
            document.getElementById("bullet-2").innerHTML = `<i class="ri-check-line"></i>${content.Bullet?.["Bullet-2"] || ""}`;
            document.getElementById("bullet-3").innerHTML = `<i class="ri-check-line"></i>${content.Bullet?.["Bullet-3"] || ""}`;
            document.getElementById("bullet-4").innerHTML = `<i class="ri-check-line"></i>${content.Bullet?.["Bullet-4"] || ""}`;
            document.getElementById("bullet-5").innerHTML = `<i class="ri-check-line"></i>${content.Bullet?.["Bullet-5"] || ""}`;

            document.getElementById("content-5").textContent = content.Ending || "";
        }

    </script>
