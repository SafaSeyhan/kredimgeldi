    <script>
        // Constants
        const DEFAULT_VALUES = {
            ihtiyac: { tutar: 10000, vade: 12 },
            konut: { tutar: 100000, vade: 12 },
            tasit: { tutar: 50000, vade: 12 }
        };

        const INSURANCE_RATES = {
            ihtiyac: 0.015,  // 1.5% yillik
            konut: 0.02,     // 2% yillik
            tasit: 0.055     // 5.5% yillik
        };

        const LOAN_LIMITS = {
            ihtiyac: [
                { min: 10000, max: 125000, minTerm: 6, maxTerm: 36 },
                { min: 125001, max: 250000, minTerm: 6, maxTerm: 24 },
                { min: 250001, max: 1000000, minTerm: 6, maxTerm: 12 }
            ],
            konut: [
                { min: 100000, max: 5000000, minTerm: 12, maxTerm: 120 }
            ],
            tasit: [
                { min: 50000, max: 1750000, minTerm: 12, maxTerm: 48 },
                { min: 1750001, max: 2500000, minTerm: 12, maxTerm: 36 }
            ]
        };

        const KREDI_ORANLARI = {
            garanti: {
                ihtiyac: { oran: 2.99 },
                konut: { oran: 2.99 },
                tasit: { oran: 2.99 },
                mevduat: { oran: 53.5 }
            },
            akbank: {
                ihtiyac: { oran: 2.59 },
                konut: { oran: 2.49 },
                tasit: { oran: 2.29 },
                mevduat: { oran: 53.4 }
            },
            ziraat: {
                ihtiyac: { oran: 2.69 },
                konut: { oran: 2.95 },
                tasit: { oran: 2.39 },
                mevduat: { oran: 53.45 }
            },
            qnb: {
                ihtiyac: { oran: 2.59 },
                konut: { oran: 2.49 },
                tasit: { oran: 2.29 },
                mevduat: { oran: 53.35 }
            },
            isbankasi: {
                ihtiyac: { oran: 2.69 },
                konut: { oran: 2.49 },
                tasit: { oran: 2.39 },
                mevduat: { oran: 53.4 }
            }
        };

        const BANK_NAMES = {
            akbank: "Akbank",
            garanti: "Garanti BBVA",
            isbankasi: "İş Bankası",
            qnb: "QNB",
            ziraat: "Ziraat Bankası"
        };

        const LOAN_TYPE_NAMES = {
            ihtiyac: "İhtiyaç Kredisi",
            konut: "Konut Kredisi",
            tasit: "Taşıt Kredisi"
        };

        const BANK_LOGOS = {
            akbank: { file: "akbank_logo.png", scale: 1 },
            garanti: { file: "garanti_logo.png", scale: 1 },
            isbankasi: { file: "isbankası.svg", scale: 5 },
            qnb: { file: "QNBFinansbank.svg", scale: 1.5 },
            ziraat: { file: "ziraatlogo.svg", scale: 7 }
        };

        // Utility Functions
        function getQueryParam(name, defaultValue = '') {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name) || defaultValue;
        }

        function formatCurrency(value) {
            return isNaN(value) ? "Hesaplanamadı" :
                value.toLocaleString("tr-TR", { style: "currency", currency: "TRY" });
        }

        function isNumber(event) {
            const charCode = event.charCode || event.keyCode;
            return charCode >= 48 && charCode <= 57;
        }

        // Input Handling Functions
        function formatNumber(input) {
            let value = input.value.replace(/\./g, '');
            const selectedTab = getSelectedLoanType();
            const limits = LOAN_LIMITS[selectedTab];

            if (limits) {
                const maxLimit = Math.max(...limits.map(limit => limit.max));
                value = Math.min(Number(value), maxLimit).toString();
            }

            let formattedValue = '';
            let count = 0;

            for (let i = value.length - 1; i >= 0; i--) {
                count++;
                formattedValue = value[i] + formattedValue;
                if (count % 3 === 0 && i !== 0) {
                    formattedValue = '.' + formattedValue;
                }
            }

            input.value = formattedValue;
            validateTutar(input);
            updateLimitsBasedOnType(selectedTab);
            updateLoanCalculations();
        }

        function validateTutar(input) {
            const value = parseFloat(input.value.replace(/\./g, ''));
            const selectedTab = getSelectedLoanType();
            const limits = LOAN_LIMITS[selectedTab];

            if (!limits) return;

            const minAmount = Math.min(...limits.map(limit => limit.min));

            if (!input.value.trim()) {
                input.setCustomValidity('Kredi tutarı boş olamaz.');
            } else if (isNaN(value) || value < minAmount) {
                input.setCustomValidity(`Kredi tutarı en az ${minAmount.toLocaleString('tr-TR')} TL olmalıdır.`);
            } else {
                input.setCustomValidity('');
            }
            input.reportValidity();
        }

        function validateVade(input) {
            const tutar = parseFloat(document.getElementById('tutar').value.replace(/\./g, ''));
            const vade = parseInt(input.value);
            const selectedTab = getSelectedLoanType();

            const limits = LOAN_LIMITS[selectedTab];
            if (!limits) return;

            let valid = false;
            for (const limit of limits) {
                if (tutar >= limit.min && tutar <= limit.max) {
                    if (vade >= (limit.minTerm || 1) && vade <= limit.maxTerm) {
                        valid = true;
                        break;
                    }
                }
            }

            if (!valid) {
                input.setCustomValidity('Bu tutar için geçersiz vade seçimi.');
            } else {
                input.setCustomValidity('');
            }
            input.reportValidity();
        }

        // Loan Calculation Functions
        function calculateLoan(principal, term, annualRate, loanType) {
            const P = parseFloat(principal);
            const r = (annualRate / 100);
            const n = parseInt(term);
            let monthlyPayment = P * (r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);

            const insuranceRate = INSURANCE_RATES[loanType] || 0;
            const totalInsuranceFee = (P * insuranceRate) * (Math.ceil(n / 12));
            let monthlyInsuranceFee = totalInsuranceFee / n;
            monthlyPayment += monthlyInsuranceFee;

            const fileRate = 0.005;
            const fileFee = P * fileRate;

            const totalInstallment = monthlyPayment * n;
            const totalPayment = totalInstallment + fileFee;

            return {
                principal: P,
                term: n,
                annualRate: annualRate,
                monthlyPayment: monthlyPayment,
                totalInstallment: totalInstallment,
                fileFee: fileFee,
                totalPayment: totalPayment
            };
        }

        // UI Update Functions
        function updateLoanCalculations() {
            const tutar = document.getElementById('tutar').value.replace(/\./g, '');
            const vade = document.getElementById('vade').value;
            const loanType = getSelectedLoanType();
            const container = document.getElementById("loan-container");

            if (!container) return;

            container.innerHTML = '';

            Object.entries(KREDI_ORANLARI).forEach(([bank, rates]) => {
                if (rates[loanType]) {
                    const calculation = calculateLoan(tutar, vade, rates[loanType].oran, loanType);
                    const card = createLoanCard(bank, loanType, calculation);
                    container.appendChild(card);
                }
            });
        }

        function createLoanCard(bank, loanType, calculation) {
            const card = document.createElement("div");
            card.className = "teklif-card bg-color-fffaeb";
            card.style.cssText = "display: flex; align-items: center; gap: 25px; width: 100%; min-height: 150px; min-width: 350px; padding: 20px; border-radius: 30px; box-shadow: 0px 0px 20px 0px rgba(0, 0, 0, 0.1);";

            card.innerHTML = `
                <div class="teklif-image-container" style="width: 300px; height: 100px; display: flex; flex-direction: column; justify-content: center; align-items: center">
                    <img class="app-image-3" data-bank-logo alt="${BANK_NAMES[bank] || bank}" style="height: 30px;">
                </div>
                <div style="display: flex;padding-right:50px; padding-left:50px; justify-content: center; width: 100%; gap:10%; flex-wrap: wrap">
                    <div style="display: flex; flex-direction: column; align-items: center;">
                        <span style="font-size: 14px; color: #777;">Toplam Miktar</span>
                        <span style="font-size: 16px; font-weight: bold;">${formatCurrency(calculation.principal)}</span>
                    </div>
                    <div style="display: flex; flex-direction: column; align-items: center;">
                        <span style="font-size: 14px; color: #777;">Aylık Ödeme</span>
                        <span style="font-size: 16px; font-weight: bold;">${formatCurrency(calculation.monthlyPayment)}</span>
                    </div>
                    <div style="display: flex; flex-direction: column; align-items: center;">
                        <span style="font-size: 14px; color: #777;">Faiz Oranı</span>
                        <span style="font-size: 16px; font-weight: bold;">${calculation.annualRate.toFixed(2)} %</span>
                    </div>
                    <div style="display: flex; flex-direction: column; align-items: center;">
                        <span style="font-size: 14px; color: #777;">Vade</span>
                        <span style="font-size: 16px; font-weight: bold;">${calculation.term} ay</span>
                    </div>
                    <div style="display: flex; flex-direction: column; align-items: center;">
                        <span style="font-size: 14px; color: #777;">Toplam Geri Ödeme</span>
                        <span style="font-size: 16px; font-weight: bold;">${formatCurrency(calculation.totalPayment)}</span>
                    </div>
                </div>
                <div class="teklif-button-container" style="display: flex; gap: 10px; justify-content: center; align-items: center; height: 100%;">
                    <a style="display: flex;align-items: anchor-center; cursor:pointer" class="default-btn text-center" style="height: 30px; font-size: small;" data-bs-toggle="modal" data-bs-target="#identificationModal"><span>Başvur</span></a>
                    <a style="display: flex;align-items: anchor-center; cursor:pointer" class="default-btn two text-center" style="height: 30px; font-size: small;" data-bs-toggle="modal" data-bs-target="#detailsModal">Detaylar</a>
                </div>
            `;

            // Başvur ve Detaylar pencereleri teklifin özetini bu bilgilerden gösterir.
            const offer = {
                bank: BANK_NAMES[bank] || bank,
                bankKey: bank,
                typeName: LOAN_TYPE_NAMES[loanType] || '',
                amount: formatCurrency(calculation.principal),
                term: String(calculation.term),
                rate: calculation.annualRate.toFixed(2),
                monthly: formatCurrency(calculation.monthlyPayment),
                fee: formatCurrency(calculation.fileFee),
                total: formatCurrency(calculation.totalPayment)
            };
            card.querySelectorAll('[data-bs-toggle="modal"]').forEach(btn => Object.assign(btn.dataset, offer));

            const logoElement = card.querySelector("[data-bank-logo]");
            if (logoElement && BANK_LOGOS[bank]) {
                logoElement.src = `assets/images/brands/${bank}/${BANK_LOGOS[bank].file}`;
                if (BANK_LOGOS[bank].scale > 1) {
                    logoElement.style.transform = `scale(${BANK_LOGOS[bank].scale})`;
                }
            }

            return card;
        }

        // Form Handling Functions
        function handleSubmit(event) {
            event.preventDefault();
            const tutar = document.getElementById('tutar').value;
            const vade = document.getElementById('vade').value;
            const tutarInput = document.getElementById('tutar');

            validateTutar(tutarInput);
            if (!tutarInput.checkValidity()) {
                tutarInput.reportValidity();
                return;
            }

            const selectedTab = getSelectedLoanType();
            window.location.href = `products.html?type=${selectedTab}&tutar=${tutar}&vade=${vade}`;
        }

        function syncInputWithSlider() {
            const vadeInput = document.getElementById('vade');
            const vadeSlider = document.getElementById('vade-slider');
            vadeInput.value = vadeSlider.value;
            // Don't call validateVade here to prevent recursive updates
        }

        function syncSliderWithInput() {
            const vadeInput = document.getElementById('vade');
            const vadeSlider = document.getElementById('vade-slider');

            let value = parseInt(vadeInput.value);
            if (isNaN(value) || value < 1) {
                value = 1;
            } else if (value > parseInt(vadeInput.max)) {
                value = parseInt(vadeInput.max);
            }

            vadeSlider.value = value;
            vadeInput.value = value; // Ensure input reflects any corrections
            // Don't call validateVade here to prevent recursive updates
        }

        function updateLimitsBasedOnType(loanType) {
            const limits = LOAN_LIMITS[loanType];
            const tutarInput = document.getElementById('tutar');
            const vadeInput = document.getElementById('vade');
            const vadeSlider = document.getElementById('vade-slider');

            if (!limits) return;

            const currentAmount = parseFloat(tutarInput.value.replace(/\./g, '')) || 0;
            const applicableLimit = limits.find(limit => currentAmount >= limit.min && currentAmount <= limit.max);

            if (applicableLimit) {
                // Store current values before updating
                const currentVade = parseInt(vadeInput.value) || 1;
                const currentSliderValue = parseInt(vadeSlider.value) || 1;

                // Update min/max values
                vadeInput.min = applicableLimit.minTerm || 1;
                vadeInput.max = applicableLimit.maxTerm;
                vadeSlider.min = applicableLimit.minTerm || 1;
                vadeSlider.max = applicableLimit.maxTerm;

                // Restore values within new bounds
                const newVade = Math.min(Math.max(currentVade, vadeInput.min), vadeInput.max);
                const newSliderValue = Math.min(Math.max(currentSliderValue, vadeSlider.min), vadeSlider.max);

                vadeInput.value = newVade;
                vadeSlider.value = newSliderValue;
            }
        }

        function getSelectedLoanType() {
            const activeTab = document.querySelector('.choose-btn .nav-link.active');
            return activeTab ? activeTab.getAttribute('data-tab') : 'ihtiyac';
        }

        function setDefaultValues(loanType) {
            const defaults = DEFAULT_VALUES[loanType] || DEFAULT_VALUES.ihtiyac;
            document.getElementById('tutar').value = defaults.tutar.toLocaleString('tr-TR');
            document.getElementById('vade').value = defaults.vade;
            document.getElementById('vade-slider').value = defaults.vade;
            updateLoanCalculations();
        }

        // Event Listeners
        document.addEventListener('DOMContentLoaded', () => {
            // Initialize from query params or defaults
            let tutar = getQueryParam("tutar", '').replace(/\./g, '');
            let vade = getQueryParam("vade", '');
            let type = getQueryParam("type", "ihtiyac");
            if (!DEFAULT_VALUES[type]) type = "ihtiyac";

            // Set active tab
            const navItems = document.querySelectorAll('.choose-btn .nav-link');
            navItems.forEach(item => item.classList.remove('active'));
            document.querySelector(`[data-tab="${type}"]`)?.classList.add("active");
            document.getElementById('vade').addEventListener('change', function () {
                validateVade(this);
            });

            document.getElementById('vade-slider').addEventListener('change', function () {
                const vadeInput = document.getElementById('vade');
                vadeInput.value = this.value;
                validateVade(vadeInput);
            });
            // Set values from params or defaults
            const tutarInput = document.getElementById("tutar");
            const vadeInput = document.getElementById("vade");

            if (tutarInput) {
                tutarInput.value = tutar ? Number(tutar).toLocaleString("tr-TR") :
                    DEFAULT_VALUES[type].tutar.toLocaleString('tr-TR');
                formatNumber(tutarInput);
            }

            if (vadeInput) {
                vadeInput.value = vade || DEFAULT_VALUES[type].vade;
                document.getElementById('vade-slider').value = vade || DEFAULT_VALUES[type].vade;
            }

            updateLimitsBasedOnType(type);
            updateLoanCalculations();

            // Add event listeners for tab changes
            navItems.forEach(item => {
                item.addEventListener('click', () => {
                    const loanType = item.getAttribute('data-tab');
                    setDefaultValues(loanType);
                    updateLimitsBasedOnType(loanType);
                });
            });
        });
    </script>
