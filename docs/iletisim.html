<body>
    <!-- Start Preloader Area -->
    <div class="preloader-area text-center position-fixed top-0 bottom-0 start-0 end-0" id="preloader">
        <div class="loader position-absolute start-0 end-0">
            <img src="assets/images/favicon.png" alt="favicon" class="img-fluid" style="width: 70px; height: 70px;">
            <div class="wavy position-relative fw-light">
                <span class="d-inline-block"></span>
                <span class="d-inline-block">K</span>
                <span class="d-inline-block">R</span>
                <span class="d-inline-block">E</span>
                <span class="d-inline-block">D</span>
                <span class="d-inline-block">I</span>
                <span class="d-inline-block">M</span>
                <span class="d-inline-block">G</span>
                <span class="d-inline-block">E</span>
                <span class="d-inline-block">L</span>
                <span class="d-inline-block">D</span>
                <span class="d-inline-block">I</span>
            </div>
        </div>
    </div>
    <!-- End Preloader Area -->

    <div id="header-placeholder"></div>
    <!-- End Navbar Area -->
    <div class="mobile-navbar offcanvas offcanvas-end border-0" data-bs-backdrop="static" tabindex="-1"
        id="navbarOffcanvas">

    </div>


    <!-- Search Modal -->
    <div class="search-modal modal fade" id="exampleModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header position-relative">
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"> </button>
                </div>
                <div class="modal-body">
                    <form class="popup-form">
                        <input type="text" class="form-control" placeholder="Search here">
                        <button type="submit" class="popup-btn">
                            <i class="ri-search-line"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <!-- End Search Modal -->




    <!-- End Contact Address Area -->

    <!-- Start Contact Form Area -->
    <div class="contact-form-area ptb-120" style="padding-bottom: 0; padding-top: 150px;">
        <div class="container">
            <div class="section-title" style="max-width: 665px;">
                <span class="sub-title two bg-color-9edd05 rounded-pill">BİZE ULAŞIN</span>
                <h2>İletişime Geçmekten Çekinmeyin</h2>
            </div>
            <div class="row g-4">
                <div class="col-lg-8 col-md-12" data-cues="slideInUp" data-duration="800">
                    <form novalidate data-kg-contact class="contact-form bg-color-fffaeb radius-30"
                        style="box-shadow: 0px 0px 10px 0px rgba(0, 0, 0, 0.2);">
                        <div class="row">
                            <div class="col-lg-6 col-md-6">
                                <input type="text" class="form-control" name="name" autocomplete="name" maxlength="120" placeholder="Ad Soyad">
                            </div>
                            <div class="col-lg-6 col-md-6">
                                <input type="email" class="form-control" name="email" autocomplete="email" maxlength="200" placeholder="E-Posta">
                            </div>
                            <div class="col-lg-6 col-md-6">
                                <input type="tel" class="form-control" name="phone" autocomplete="tel" maxlength="30" placeholder="Telefon (İsteğe Bağlı)">
                            </div>
                            <div class="col-lg-6 col-md-6">
                                <input type="text" class="form-control" name="subject" maxlength="200" placeholder="Konu">
                            </div>
                            <div class="col-lg-12 col-md-12">
                                <textarea class="form-control textarea" name="message" maxlength="5000" placeholder="Mesajınız..."></textarea>
                            </div>
                        </div>

                        <button type="submit" class="default-btn">Mesaj Gönder <i
                                class="ri-arrow-right-up-line"></i></button>
                    </form>
                </div>
                <div class="col-lg-4 col-md-12" data-cues="slideInDown" data-duration="800">
                    <div class="contact-map">
                        <iframe style="box-shadow: 0px 0px 10px 0px rgba(0, 0, 0, 0.2); border:0;"
                            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d114964.53925916665!2d-80.2994992!3d25.7823907!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x88d9b0a58e9569f7%3A0xe71e83763365d4a1!2sMiami%2C%20FL%2C%20USA!5e0!3m2!1sen!2str!4v1700000000000!5m2!1sen!2str"
                            width="100%" height="450" allowfullscreen="" loading="lazy"
                            referrerpolicy="no-referrer-when-downgrade">
                        </iframe>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- End Contact Form Area -->


    <!-- Start Contact Address Area -->
    <div class="contact-address-area ptb-120 overflow-hidden" style="padding-top: 40px;">
        <div class="container">
            <div class="address-container bg-color-0c3a30 radius-20" style="background-color: #fffcec;
            /* bg shadow */
            /* black text */
            color: #000;
            box-shadow: 0px 0px 10px 0px rgba(0, 0, 0, 0.2);
            ">
                <div class="contact-warp d-flex align-items-center justify-content-between" data-cues="slideInDown"
                    data-duration="700">
                    <div class="location position-relative" style="
                    /* font color white */
                    color: #000;
                    ">
                        <i class="flaticon-phone-call call-icon"></i>
                        <span style="color: #000;">Telefon</span>
                        <a style="color: #000;" href="tel:000946862091">+90 534 000 00 00</a>
                    </div>
                    <div class="location position-relative">
                        <i class="flaticon-email-1 call-icon"></i>
                        <span style="color: #000;">E-Posta</span>
                        <a style="color: #000;" href="mailto:info@kredimgeldi.com">info@kredimgeldi.com</a>
                    </div>
                    <div class="location position-relative">
                        <i class="flaticon-maps-and-flags call-icon"></i>
                        <span style="color: #000;">Merkezimiz</span>
                        <a style="color: #000;" href="https://maps.app.goo.gl/p2Mj3tx74CBgnfjH8">Fire Media Marketing
                            Miami FL, USA</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Start Footer Area -->

    <!-- End Copyright Area -->

        fetch('components/mobile_navbar.html?v=2')
            .then(response => response.text())
            .then(data => {
                document.getElementById('navbarOffcanvas').innerHTML = data;
            });





        fetch('components/footer.html?v=3')
            .then(response => response.text())
            .then(data => {
                // document.getElementById('footer-area') add as a scildren
                document.getElementById('footer-placeholder').innerHTML = data;
            });

        .main-navbar {
            box-shadow: 0px 0px 20px 0px rgba(0, 0, 0, 0.1);
