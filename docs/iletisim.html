<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Kredi başvurunuz, teklifler veya üyeliğinizle ilgili sorularınız için KredimGeldi ile iletişime geçin.">

    <meta property="og:locale" content="tr_TR">
    <meta property="og:title" content="İletişim - KredimGeldi">
    <meta property="og:description" content="Kredi başvurunuz, teklifler veya üyeliğinizle ilgili sorularınız için KredimGeldi ile iletişime geçin.">

    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:url" content="https://kredimgeldi.com/iletisim.html">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="İletişim - KredimGeldi">
    <meta name="twitter:description" content="Kredi başvurunuz, teklifler veya üyeliğinizle ilgili sorularınız için KredimGeldi ile iletişime geçin.">
    <meta name="twitter:image" content="https://kredimgeldi.com/assets/images/preview.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,100..900;1,100..900&family=Outfit:wght@100..900&display=swap">

    <!-- Essential CSS Files -->
    <link rel="stylesheet" href="assets/css/swiper-bundle.min.css">
    <link rel="stylesheet" href="assets/css/flaticon_finto.css">
    <link rel="stylesheet" href="assets/css/scrollCue.css">
    <link rel="stylesheet" href="assets/css/remixicon.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/responsive.css">

    <!-- Title & Favicon -->
    <title>İletişim - KredimGeldi</title>

    <link rel="icon" type="image/png" href="assets/images/favicon.png">
</head>

<body>
    <!-- Start Preloader Area -->
    <div class="preloader-area text-center position-fixed top-0 bottom-0 start-0 end-0" id="preloader">
        <div class="loader position-absolute start-0 end-0">
            <img src="assets/images/favicon.png" alt="favicon" class="img-fluid" style="width: 70px; height: 70px;">
            <div class="wavy position-relative fw-light">
                <span class="d-inline-block"></span>
                <span class="d-inline-block">K</span>
                <span class="d-inline-block">R</span>
                <span class="d-inline-block">E</span>
                <span class="d-inline-block">D</span>
                <span class="d-inline-block">I</span>
                <span class="d-inline-block">M</span>
                <span class="d-inline-block">G</span>
                <span class="d-inline-block">E</span>
                <span class="d-inline-block">L</span>
                <span class="d-inline-block">D</span>
                <span class="d-inline-block">I</span>
            </div>
        </div>
    </div>
    <!-- End Preloader Area -->

    <div id="header-placeholder"></div>
    <!-- End Navbar Area -->
    <div class="mobile-navbar offcanvas offcanvas-end border-0" data-bs-backdrop="static" tabindex="-1"
        id="navbarOffcanvas">

    </div>




    <!-- End Contact Address Area -->

    <!-- Start Contact Form Area -->
    <div class="contact-form-area ptb-120" style="padding-bottom: 0; padding-top: 150px;">
        <div class="container">
            <div class="section-title" style="max-width: 665px;">
                <span class="sub-title two bg-color-9edd05 rounded-pill">BİZE ULAŞIN</span>
                <h2>İletişime Geçmekten Çekinmeyin</h2>
            </div>
            <div class="row g-4">
                <div class="col-lg-8 col-md-12" data-cues="slideInUp" data-duration="800">
                    <form novalidate data-kg-contact class="contact-form bg-color-fffaeb radius-30"
                        style="box-shadow: 0px 0px 10px 0px rgba(0, 0, 0, 0.2);">
                        <div class="row">
                            <div class="col-lg-6 col-md-6">
                                <input type="text" class="form-control" name="name" autocomplete="name" maxlength="120" placeholder="Ad Soyad">
                            </div>
                            <div class="col-lg-6 col-md-6">
                                <input type="email" class="form-control" name="email" autocomplete="email" maxlength="200" placeholder="E-Posta">
                            </div>
                            <div class="col-lg-6 col-md-6">
                                <input type="tel" class="form-control" name="phone" autocomplete="tel" maxlength="30" placeholder="Telefon (İsteğe Bağlı)">
                            </div>
                            <div class="col-lg-6 col-md-6">
                                <input type="text" class="form-control" name="subject" maxlength="200" placeholder="Konu">
                            </div>
                            <div class="col-lg-12 col-md-12">
                                <textarea class="form-control textarea" name="message" maxlength="5000" placeholder="Mesajınız..."></textarea>
                            </div>
                        </div>

                        <button type="submit" class="default-btn">Mesaj Gönder <i
                                class="ri-arrow-right-up-line"></i></button>
                    </form>
                </div>
                <div class="col-lg-4 col-md-12" data-cues="slideInDown" data-duration="800">
                    <div class="contact-map">
                        <iframe title="KredimGeldi konum" style="box-shadow: 0px 0px 10px 0px rgba(0, 0, 0, 0.2); border:0;"
                            src="https://www.google.com/maps?q=%C4%B0stanbul%2C%20T%C3%BCrkiye&amp;z=11&amp;output=embed"
                            width="100%" height="450" allowfullscreen="" loading="lazy"
                            referrerpolicy="no-referrer-when-downgrade">
                        </iframe>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- End Contact Form Area -->


    <!-- Start Contact Address Area -->
    <div class="contact-address-area ptb-120 overflow-hidden" style="padding-top: 40px;">
        <div class="container">
            <div class="address-container radius-20" style="background-color: #fffcec; color: #000;
            box-shadow: 0px 0px 10px 0px rgba(0, 0, 0, 0.2);">
                <div class="contact-warp d-flex align-items-center justify-content-between" data-cues="slideInDown"
                    data-duration="700">
                    <div class="location position-relative">
                        <i class="flaticon-phone-call call-icon"></i>
                        <span style="color: #000;">Telefon</span>
                        <a style="color: #000;" href="tel:+908500000000">0850 000 00 00</a>
                    </div>
                    <div class="location position-relative">
                        <i class="flaticon-email-1 call-icon"></i>
                        <span style="color: #000;">E-Posta</span>
                        <a style="color: #000;" href="mailto:info@kredimgeldi.com">info@kredimgeldi.com</a>
                    </div>
                    <div class="location position-relative">
                        <i class="flaticon-maps-and-flags call-icon"></i>
                        <span style="color: #000;">Merkezimiz</span>
                        <a style="color: #000;" href="https://www.google.com/maps/search/?api=1&amp;query=Istanbul" target="_blank" rel="noopener">İstanbul, Türkiye</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- End Contact Address Area -->


    <!-- Start Footer Area -->
    <div id="footer-placeholder" class="footer-area bg-color-0c3a30 pt-120">
    </div>
    <!-- End Footer Area -->

    <!-- Start Copyright Area -->

    <!-- End Copyright Area -->

    <!-- Go top Btn -->
    <div class="go-top">
        <i class="ri-arrow-up-fill"></i>
    </div>
    <!-- Go top Btn End -->

    <!-- JS Files -->
    <script src="assets/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/swiper-bundle.min.js"></script>
    <script src="assets/js/fslightbox.min.js"></script>
    <script src="assets/js/smooth-scroll.js"></script>
    <script src="assets/js/scrollCue.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
    <script src="assets/js/auth-config.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/script.js?v=4"></script>
    <script src="assets/js/formlar.js?v=1"></script>
    <script>
        fetch('components/mobile_navbar.html?v=4')
            .then(response => response.text())
            .then(data => {
                document.getElementById('navbarOffcanvas').innerHTML = data;
            });





        fetch('components/footer.html?v=6')
            .then(response => response.text())
            .then(data => {
                // document.getElementById('footer-area') add as a scildren
                document.getElementById('footer-placeholder').innerHTML = data;
            });
    </script>

    <style>
        .main-navbar {
            box-shadow: 0px 0px 20px 0px rgba(0, 0, 0, 0.1);
            position: absolute;
            width: 100%;
        }
    </style>
</body>

</html>
